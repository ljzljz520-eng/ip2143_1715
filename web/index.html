<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车间安全提示窗</title><style>body{font-family:system-ui;margin:2rem;background:#f3f5f7;color:#17212b}main{max-width:900px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #274c5e}section{background:white;margin-top:1rem;padding:1rem;border:1px solid #d2d9de;border-radius:6px}button{background:#274c5e;color:white;border:0;padding:.6rem 1rem;border-radius:4px}li{margin:.5rem 0}.status{font-weight:600}</style></head>
<body><main><header><h1>车间安全提示窗</h1><button id="refresh">刷新</button></header><section><p>登记、审核、变更和归档当前安全提示。</p><ul id="records"><li>等待服务响应</li></ul></section></main><script>async function load(){const list=document.querySelector('#records');try{const r=await fetch('/records');const data=await r.json();list.innerHTML=data.map(x=>`<li><span class="status">#${x.number}</span> ${x.title} - ${x.status}</li>`).join('')||'<li>暂无提示窗</li>'}catch(e){list.innerHTML='<li>服务未连接</li>'}}document.querySelector('#refresh').addEventListener('click',load);load();</script><!-- generated --></body>
</html>
